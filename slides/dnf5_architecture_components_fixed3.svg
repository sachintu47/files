<!-- Fixed vertical-layout DNF5 architecture diagram: repositories above librepo (vertical stack), single "metadata & packages" label, no dotted lines inside libdnf, aligned arrows and smaller arrowheads. Ampersands escaped. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Fixed vertical DNF5 architecture diagram">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6fbff; stroke: #1e6cf0; stroke-width: 2; rx:10; ry:10; }
    .sub { fill: #ffffff; stroke: #dceeff; stroke-width: 1.2; rx:6; ry:6; }
    .title { font: 700 15px Arial, Helvetica, sans-serif; fill: #0b3a72; }
    .label { font: 13px Arial, Helvetica, sans-serif; fill: #0e3a5a; }
    .note { font: 12px Arial, Helvetica, sans-serif; fill: #27445a; }
    .arrow { stroke: #1e6cf0; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .thin { stroke-width: 1.4; }
    .dashed { stroke: #6b7280; stroke-width: 1.6; stroke-dasharray: 6 4; fill: none; }
  </style>

  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#1e6cf0"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="520"/>

  <!-- Left column: vertical stack -->
  <!-- Remote Repositories -->
  <g transform="translate(60,60)">
    <rect class="box" x="0" y="0" width="220" height="90"/>
    <text x="14" y="32" class="title">Remote Repositories</text>
    <text x="14" y="56" class="label">repomd • metadata • packages</text>
  </g>

  <!-- librepo below repositories -->
  <g transform="translate(60,170)">
    <rect class="box" x="0" y="0" width="220" height="90"/>
    <text x="16" y="34" class="title">librepo</text>
    <text x="16" y="56" class="label">fetch &amp; download</text>
  </g>

  <!-- Arrow: repositories -> librepo (vertical) -->
  <path class="arrow" d="M170 150 L170 170" />

  <!-- Arrow: librepo -> libdnf (diagonal right) -->
  <path class="arrow" d="M280 215 L420 180" />

  <!-- libdnf (center) -->
  <g transform="translate(420,120)">
    <rect class="box" x="0" y="0" width="380" height="200"/>
    <text x="18" y="34" class="title">libdnf (libdnf5)</text>
    <text x="18" y="56" class="label">orchestration • transaction manager</text>

    <!-- Metadata Store -->
    <g transform="translate(18,72)">
      <rect class="sub" x="0" y="0" width="160" height="56"/>
      <text x="12" y="26" class="label">Metadata Store</text>
      <text x="12" y="44" class="note">repo metadata &amp; pkg lists</text>
    </g>

    <!-- Transaction Manager -->
    <g transform="translate(196,72)">
      <rect class="sub" x="0" y="0" width="160" height="56"/>
      <text x="12" y="26" class="label">Transaction</text>
      <text x="12" y="44" class="note">history &amp; audit</text>
    </g>

  </g>

  <!-- dnf5 CLI (above libdnf, centered) -->
  <g transform="translate(490,30)">
    <rect class="box" x="0" y="0" width="240" height="70"/>
    <text x="18" y="36" class="title">dnf5 CLI &amp; Plugins</text>
  </g>

  <!-- Arrow: dnf5 CLI -> libdnf (down) -->
  <path class="arrow" d="M610 100 L610 120" />

  <!-- libsolv (below libdnf) -->
  <g transform="translate(520,340)">
    <rect class="box" x="0" y="0" width="160" height="70"/>
    <text x="12" y="30" class="title">libsolv</text>
    <text x="12" y="48" class="label">dependency solver</text>
  </g>

  <!-- Arrow: libdnf -> libsolv (down) -->
  <path class="arrow" d="M610 320 L610 340" />

  <!-- librpm (right) -->
  <g transform="translate(940,150)">
    <rect class="box" x="0" y="0" width="200" height="120"/>
    <text x="14" y="36" class="title">librpm / rpm</text>
    <text x="14" y="60" class="label">low-level installer • rpmdb</text>

    <rect class="sub" x="14" y="76" width="64" height="36"/>
    <text x="20" y="96" class="note">rpmdb</text>

    <rect class="sub" x="94" y="76" width="64" height="36"/>
    <text x="100" y="96" class="note">system</text>
  </g>

  <!-- Arrow: libdnf -> librpm (right) -->
  <path class="arrow" d="M800 220 L940 220" />

  <!-- Transaction history dashed link (moved lower, non-overlapping) -->
  <path class="dashed" d="M520 360 L920 360" />
  <text x="640" y="356" class="note">transaction history / audit</text>

  <!-- Labels: single metadata label only -->
  <text x="260" y="200" class="note">fetched metadata</text>

  <!-- Footer -->
  <text x="14" y="504" class="note">Vertical layout fixed: repositories above librepo; single metadata label; no dotted lines inside libdnf; arrows aligned. Save and insert into slide.</text>
</svg>