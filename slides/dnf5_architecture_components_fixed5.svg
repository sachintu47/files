<!-- Final fixed DNF5 architecture diagram: vertical Repos->librepo, dnf5 CLI above libdnf, libsolv below, arrows centered and straight, no dotted lines inside libdnf or libsolv. Ampersands escaped. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="520" viewBox="0 0 1300 520" role="img" aria-label="DNF5 architecture corrected final">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f7fbff; stroke: #1d6ef0; stroke-width: 2; rx:10; ry:10; }
    .sub { fill: #ffffff; stroke: #e6f0ff; stroke-width: 1.2; rx:6; ry:6; }
    .title { font: 700 15px Arial, Helvetica, sans-serif; fill: #0b3a72; }
    .label { font: 13px Arial, Helvetica, sans-serif; fill: #0e3a5a; }
    .note { font: 12px Arial, Helvetica, sans-serif; fill: #27445a; }
    .arrow { stroke: #1d6ef0; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .smallarrow { stroke: #1d6ef0; stroke-width: 1.6; fill: none; marker-end: url(#sm); }
  
  </style>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#1d6ef0"/>
    </marker>
    <marker id="sm" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#1d6ef0"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1300" height="520"/>

  <!-- Remote Repositories (left, top) -->
  <g transform="translate(60,60)">
    <rect class="box" x="0" y="0" width="240" height="90"/>
    <text x="16" y="36" class="title">Remote Repositories</text>
    <text x="16" y="60" class="label">repomd · metadata · packages</text>
  </g>

  <!-- librepo (left, below repos) -->
  <g transform="translate(60,170)">
    <rect class="box" x="0" y="0" width="240" height="90"/>
    <text x="18" y="42" class="title">librepo</text>
    <text x="18" y="64" class="label">fetch &amp; download</text>
  </g>

  <!-- Vertical arrow: repositories -> librepo -->
  <path class="smallarrow" d="M180 150 L180 170" />

  <!-- librepo -> libdnf (straight diagonal to left edge of libdnf) -->
  <path class="arrow" d="M300 215 L440 220" />
  <text x="360" y="206" class="note">fetched metadata</text>

  <!-- Center: libdnf -->
  <g transform="translate(440,120)">
    <rect class="box" x="0" y="0" width="420" height="220"/>
    <text x="20" y="38" class="title">libdnf (libdnf5)</text>
    <text x="20" y="62" class="label">orchestration · transaction manager</text>

    <!-- internal sub-boxes -->
    <g transform="translate(22,80)">
      <rect class="sub" x="0" y="0" width="180" height="64"/>
      <text x="12" y="30" class="label">Metadata Store</text>
      <text x="12" y="48" class="note">repo metadata &amp; pkg lists</text>

      <rect class="sub" x="206" y="0" width="180" height="64"/>
      <text x="216" y="30" class="label">Transaction</text>
      <text x="216" y="48" class="note">history &amp; audit</text>
    </g>
  </g>

  <!-- dnf5 CLI (above libdnf, centered) -->
  <g transform="translate(500,20)">
    <rect class="box" x="0" y="0" width="300" height="72"/>
    <text x="20" y="40" class="title">dnf5 CLI &amp; Plugins</text>
    <text x="20" y="58" class="label">user commands</text>
  </g>

  <!-- Arrow: dnf5 CLI -> libdnf (straight vertical) -->
  <path class="smallarrow" d="M650 92 L650 120" />

  <!-- libsolv (below libdnf, centered) -->
  <g transform="translate(610,360)">
    <rect class="box" x="0" y="0" width="180" height="64"/>
    <text x="12" y="28" class="title">libsolv</text>
    <text x="12" y="46" class="label">dependency solver</text>
  </g>

  <!-- Arrow: libdnf -> libsolv (vertical, centered) -->
  <path class="smallarrow" d="M650 340 L650 360" />

  <!-- Right: librpm -->
  <g transform="translate(980,170)">
    <rect class="box" x="0" y="0" width="220" height="120"/>
    <text x="18" y="40" class="title">librpm / rpm</text>
    <text x="18" y="64" class="label">low-level installer · rpmdb</text>

    <rect class="sub" x="18" y="78" width="72" height="36"/>
    <text x="24" y="102" class="note">rpmdb</text>

    <rect class="sub" x="112" y="78" width="76" height="36"/>
    <text x="118" y="102" class="note">system</text>
  </g>

  <!-- Arrow: libdnf -> librpm (straight horizontal, centered) -->
  <path class="arrow" d="M860 220 L980 220" />
  <text x="920" y="208" class="note">invoke installer</text>

  <!-- Transaction history dashed link (non-overlapping) -->
  <path class="smallarrow" d="M520 360 L760 360" />
  <path class="smallarrow" d="M760 360 L920 360" />
  <text x="620" y="356" class="note">transaction history / audit</text>

  <!-- Footer note -->
  <text x="18" y="504" class="note">Final: arrows centered to box edges, text fits boxes, libsolv has no dotted lines. Save &amp; insert into slide.</text>
</svg>